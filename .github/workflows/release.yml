name: Release

on:
  push:
    tags: ["v*"]

jobs:
  # Never publish a release for a tag whose tests fail.
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags, needed to find the previous tag

      - name: Generate release notes
        run: bash .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags like v1.1.0-rc.1 are published as pre-releases.
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease
