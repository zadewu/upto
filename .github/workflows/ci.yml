name: CI

on:
  push:
    branches: ["**"] # tag pushes are tested via release.yml instead
  pull_request:
  workflow_call: # reused by release.yml as a gate before publishing

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, fish: latest }
          - { os: macos-latest, fish: latest }
          # Distro package lags behind (fish 3.x) — guards backwards compatibility.
          - { os: ubuntu-latest, fish: distro }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - if: matrix.fish == 'latest'
        uses: fish-actions/install-fish@v1

      - if: matrix.fish == 'distro'
        run: sudo apt-get update -qq && sudo apt-get install --yes fish

      - name: Install fishtape
        shell: fish {0}
        run: |
          fish --version
          curl -sL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish | source
          fisher install jorgebucaran/fishtape

      - name: Test
        shell: fish {0}
        run: fishtape tests/*.fish
